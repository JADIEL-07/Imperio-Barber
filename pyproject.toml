[project]
name = "imperio-barber"
version = "0.1.0"
description = "Monorepo para Imperio Barber"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "services/auth/tests",
    "services/catalog/tests",
    "services/booking/tests",
    "tests",
]
markers = [
    "unit: pruebas unitarias sin dependencias externas",
    "integration: pruebas de integracion con base de datos real",
    "contract: pruebas de contratos de API entre servicios",
    "e2e: pruebas de flujos completos end-to-end",
]
asyncio_mode = "auto"
