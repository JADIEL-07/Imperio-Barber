services:
  postgres-test:
    image: postgres:16-alpine
    container_name: imperio-postgres-test
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
