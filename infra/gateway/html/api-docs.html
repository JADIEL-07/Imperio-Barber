<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Imperio Barber &mdash; API Docs</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f12; }
  #banner {
    padding: 0.6rem 1.25rem;
    background: #181c1f;
    border-bottom: 1px solid #313539;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #a08e7a;
    font-size: 0.8rem;
  }
  #banner strong { color: #ffc174; }

  /* Topbar de Swagger UI (donde vive el selector de microservicio): se
     mantiene, solo se repinta oscura en vez del verde por defecto. */
  .swagger-ui .topbar {
    background-color: #181c1f;
    border-bottom: 1px solid #313539;
    padding: 10px 0;
  }
  .swagger-ui .topbar .download-url-wrapper .select-label select {
    border-color: #ffc174;
  }
  .swagger-ui .topbar .download-url-wrapper .download-url-button {
    background: #ffc174;
    color: #181c1f;
  }
  /* Oculta el logo/link por defecto de Swagger ("swagger" a la izquierda) */
  .swagger-ui .topbar .topbar-wrapper img,
  .swagger-ui .topbar .topbar-wrapper a {
    display: none;
  }
  /* Oculta el link directo al .json crudo de la spec activa */
  .swagger-ui .info a.link[href$="openapi.json"] {
    display: none;
  }
</style>
</head>
<body>
<div id="banner">Imperio Barber &mdash; <strong>API Docs</strong>: usa el selector de arriba para cambiar entre Auth / Catalog / Booking.</div>
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
  window.onload = function () {
    window.ui = SwaggerUIBundle({
      urls: [
        { url: "/api/auth/openapi.json", name: "Auth" },
        { url: "/api/catalog/openapi.json", name: "Catalog" },
        { url: "/api/bookings/openapi.json", name: "Booking" }
      ],
      "urls.primaryName": "Auth",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      deepLinking: true
    });
  };
</script>
</body>
</html>
