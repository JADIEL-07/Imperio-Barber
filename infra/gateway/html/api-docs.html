<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Imperio Barber &mdash; API Docs</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f12; }
  #topbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    background: #181c1f;
    border-bottom: 1px solid #313539;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #topbar h1 { font-size: 1rem; margin: 0; color: #ffc174; font-weight: 600; }
  #topbar span { color: #a08e7a; font-size: 0.8rem; }
  /* Oculta la topbar verde por defecto de Swagger UI (ya tenemos la nuestra) */
  .swagger-ui .topbar { display: none; }
</style>
</head>
<body>
<div id="topbar">
  <h1>Imperio Barber API</h1>
  <span>&mdash; usa el selector de la izquierda (dentro del cuadro) para cambiar de microservicio</span>
</div>
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
<script>
  window.onload = function () {
    window.ui = SwaggerUIBundle({
      urls: [
        { url: "/api/auth/openapi.json", name: "Auth" },
        { url: "/api/catalog/openapi.json", name: "Catalog" },
        { url: "/api/bookings/openapi.json", name: "Booking" }
      ],
      "urls.primaryName": "Auth",
      dom_id: "#swagger-ui",
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: "StandaloneLayout",
      deepLinking: true
    });
  };
</script>
</body>
</html>
