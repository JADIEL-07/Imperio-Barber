<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Imperio Barber API</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0f12;
    color: #e0e3e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 560px;
    width: 100%;
    padding: 2.5rem;
    margin: 1rem;
    background: #181c1f;
    border: 1px solid #313539;
    border-radius: 12px;
  }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
    color: #ffc174;
  }
  p.subtitle {
    margin: 0 0 1.75rem;
    color: #d8c3ad;
    font-size: 0.9rem;
  }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem; }
  a.endpoint {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.9rem 1.1rem;
    background: #1c2023;
    border: 1px solid #313539;
    border-radius: 8px;
    color: #e0e3e7;
    text-decoration: none;
    transition: background 0.15s;
  }
  a.endpoint:hover { background: #262a2e; }
  a.endpoint span.name { font-weight: 600; }
  a.endpoint span.path { color: #d8c3ad; font-size: 0.8rem; font-family: monospace; }
  footer { margin-top: 1.75rem; font-size: 0.75rem; color: #a08e7a; }
</style>
</head>
<body>
<main>
  <h1>Imperio Barber &mdash; API</h1>
  <p class="subtitle">Este dominio solo sirve el backend. Usa estas rutas para probar los endpoints (GET/POST/PATCH) y modelos de cada microservicio.</p>
  <ul>
    <li><a class="endpoint" href="/api/auth/docs"><span class="name">Auth</span><span class="path">/api/auth/docs</span></a></li>
    <li><a class="endpoint" href="/api/catalog/docs"><span class="name">Catalog</span><span class="path">/api/catalog/docs</span></a></li>
    <li><a class="endpoint" href="/api/bookings/docs"><span class="name">Booking</span><span class="path">/api/bookings/docs</span></a></li>
    <li><a class="endpoint" href="/health"><span class="name">Gateway health</span><span class="path">/health</span></a></li>
  </ul>
  <footer>El frontend vive en otro dominio.</footer>
</main>
</body>
</html>
