events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream auth_upstream {
        server auth-service:8000;
    }

    upstream catalog_upstream {
        server catalog-service:8000;
    }

    upstream booking_upstream {
        server booking-service:8000;
    }

    upstream web_upstream {
        server web:3000;
    }

    # --- Dominio del backend: solo API, nunca el frontend ---
    # Ej. backend.imperio.newonline.digital
    server {
        listen 80;
        server_name backend.imperio.newonline.digital;

        include /etc/nginx/snippets/api-locations.conf;

        location = / {
            root /usr/share/nginx/backend;
            try_files /backend-index.html =404;
        }
    }

    # --- Dominio del frontend: solo la web, sin exponer la API aquí ---
    # Ej. imperio.newonline.digital
    server {
        listen 80;
        server_name imperio.newonline.digital;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # --- Fallback: IP directa o cualquier dominio no configurado arriba ---
    # Mismo comportamiento de siempre (frontend + API bajo un solo dominio),
    # por si se vuelve a usar un despliegue de un solo dominio.
    server {
        listen 80 default_server;
        server_name _;

        include /etc/nginx/snippets/api-locations.conf;

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
