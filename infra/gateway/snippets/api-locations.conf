# Rutas de API compartidas por el server del dominio backend-only y por el
# server por defecto (fallback de un solo dominio / acceso directo por IP).
# Se incluye con `include` en vez de duplicarse en cada server block.

location /health {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
}

# Un solo Swagger UI con selector para los 3 microservicios a la vez.
location = /api/docs {
    root /usr/share/nginx/html;
    try_files /api-docs.html =404;
}

# Auth Service (both /api/auth and /auth)
location /api/auth {
    proxy_pass http://auth_upstream/auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

location /auth {
    proxy_pass http://auth_upstream/auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

