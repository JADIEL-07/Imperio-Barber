server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Recursos del build de Flutter: se pueden cachear.
    location ~* \.(?:js|css|wasm|png|jpg|jpeg|svg|ico|otf|ttf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html y bootstrap: siempre validar con el servidor para recibir builds nuevos.
    # Las rutas de la app (/reservar, /admin/citas...) caen en index.html (SPA).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
