services:
  postgres:
    image: postgres:16-alpine
    container_name: imperio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - imperio-network

  gateway:
    image: nginx:alpine
    container_name: imperio-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - booking-service
    networks:
      - imperio-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: imperio-auth
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db
      - SESSION_SECRET=${SESSION_SECRET:-supersecretkey32charactersminimum!}
      - ENVIRONMENT=development
    depends_on:
      - postgres
    networks:
      - imperio-network

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: imperio-catalog
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/catalog_db
      - SESSION_SECRET=${SESSION_SECRET:-supersecretkey32charactersminimum!}
      - ENVIRONMENT=development
    depends_on:
      - postgres
    networks:
      - imperio-network

  booking-service:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    container_name: imperio-booking
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/booking_db
      - SESSION_SECRET=${SESSION_SECRET:-supersecretkey32charactersminimum!}
      - CATALOG_SERVICE_URL=http://catalog-service:8000/catalog
      - AUTH_SERVICE_URL=http://auth-service:8000/auth
      - ENVIRONMENT=development
    depends_on:
      - postgres
    networks:
      - imperio-network

volumes:
  postgres_data:

networks:
  imperio-network:
    driver: bridge
